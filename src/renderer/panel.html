<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DLSS 5 Developer Controls</title>
<link rel="stylesheet" href="panel.css" />
</head>
<body class="dlss5">
  <!-- The top strip is the drag handle: the window is frameless, so this is its title bar. It holds
       the game this panel is pointed at and nothing else -- the in-game panel dropped its title row,
       its theme button and its close X on 2026-09-22, and this window is that panel. The select opts
       back out of the drag, or it would drag instead of open. Every edge resizes the window (Windows
       gives a frameless resizable window its own borders). -->
  <header class="p-title">
    <select id="p-game" class="p-select p-game"></select>
    <span class="p-help" data-tip-key="Drag the title bar to move this window, or drag any edge or corner to resize it. Where it is and how big it is are remembered.">(?)</span>
  </header>

  <div class="p-scroll">
    <!-- The six pages, then the rows that are drawn whatever page is open: whether the pass runs,
         where it sits, and the badge that says whether it is actually doing anything. -->
    <div id="p-pages" class="p-pages"></div>
    <div id="p-head"></div>
    <div id="p-status" class="p-note"></div>
    <!-- The same number the in-game panel shows as "Running - N ms per frame". Hidden until there
         is one to show, so a game that has never run does not carry an empty readout. -->
    <div id="p-timing" class="p-timing" hidden>
      <span class="p-timing-main"><b id="p-timing-ms"></b> <span id="p-timing-fps" class="p-timing-fps"></span></span>
      <span id="p-timing-sub" class="p-timing-sub"></span>
    </div>
    <div id="p-fields"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/ko.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/fr.js"></script>
  <script src="panel.js"></script>
</body>
</html>
