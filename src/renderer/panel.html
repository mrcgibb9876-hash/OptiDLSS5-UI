<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DLSS 5</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="panel.css" />
</head>
<body class="panel-body">
  <!-- The whole bar drags the window: it is frameless, so this is the title bar. It is the app's own
       topbar, same colours and same brand mark, so the panel reads as this app and not as a stray
       Windows window. The buttons opt back out of the drag region or they would drag, not click. -->
  <header class="topbar panel-bar">
    <div class="brand">
      <img class="brand-mark" src="icon.png" alt="" />
      <span class="brand-name">DLSS 5</span>
    </div>
    <div class="topbar-actions panel-bar-actions">
      <button id="panel-theme" class="btn btn-ghost btn-small btn-icon" data-i18n-title title="Light or dark" aria-label="Light or dark"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 1.2a6.8 6.8 0 1 0 0 13.6A6.8 6.8 0 0 0 8 1.2zm0 1.4v10.8a5.4 5.4 0 0 1 0-10.8z"/></svg></button>
      <button id="panel-close" class="btn btn-ghost btn-small btn-icon" data-i18n-title title="Close (the hotkey reopens it)" aria-label="Close"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </header>

  <div class="panel-scroll">
    <label class="field-label" data-i18n>Game</label>
    <div class="field-row">
      <select id="panel-game"></select>
    </div>
    <div id="panel-status" class="status-line"></div>
    <p id="panel-helper-note" class="field-hint hidden" data-i18n><strong>This game runs the 32-bit route</strong>, so these are read from and written to host64\OptiScaler.ini -- the copy the helper process actually loads. That is also why the panel never appears over the game.</p>

    <!-- Emulators only: the model's resolution named as a resolution, the way an RPCS3 user thinks
         of it. Hidden for everything else, exactly as in the Edit dialog. -->
    <div id="panel-emulator" class="field-subblock hidden">
      <label class="field-label" data-i18n>Emulator: DLSS 5 resolution</label>
      <div class="field-row">
        <select id="panel-emulator-res"></select>
      </div>
      <span id="panel-emulator-note" class="status-line"></span>
    </div>

    <div id="panel-fields"></div>

    <div class="field-row panel-footer">
      <button id="panel-reset" class="btn btn-ghost" data-i18n>Reset all to default</button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/ko.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/fr.js"></script>
  <script src="panel.js"></script>
</body>
</html>
