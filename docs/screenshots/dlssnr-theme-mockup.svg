<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1160" height="620" fill="#0d0d0e"/>

  <!-- ============ LIGHT PANEL ============ -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="520" height="540" rx="10" fill="#999999"/>
    <rect x="0" y="0" width="520" height="46" rx="10" fill="#A6A6A6"/>
    <rect x="0" y="30" width="520" height="16" fill="#A6A6A6"/>
    <text x="20" y="30" fill="#000000" font-size="20" font-weight="600">DLSS 5 DEVELOPER CONTROLS</text>

    <text x="20" y="80" fill="#000000" font-size="15" font-weight="700" letter-spacing="1">GLOBAL CONTROLS</text>
    <line x1="20" y1="90" x2="500" y2="90" stroke="#858688" stroke-width="1"/>

    <text x="20" y="122" fill="#000000" font-size="14">Model preset</text>
    <rect x="220" y="106" width="280" height="26" rx="4" fill="#858688"/>
    <rect x="220" y="106" width="180" height="26" rx="4" fill="#27350E"/>
    <text x="230" y="123" fill="#FFFFFF" font-size="12">Quality</text>

    <text x="20" y="164" fill="#000000" font-size="14">Intensity</text>
    <rect x="220" y="152" width="280" height="10" rx="5" fill="#858688"/>
    <rect x="220" y="152" width="190" height="10" rx="5" fill="#79A135"/>
    <circle cx="410" cy="157" r="8" fill="#27350E"/>
    <text x="440" y="163" fill="#1E1F21" font-size="12">0.72x</text>

    <text x="20" y="204" fill="#1E1F21" font-size="13">Local structure</text>
    <rect x="220" y="192" width="280" height="10" rx="5" fill="#858688"/>
    <rect x="220" y="192" width="120" height="10" rx="5" fill="#79A135"/>
    <circle cx="340" cy="197" r="8" fill="#27350E"/>

    <text x="20" y="244" fill="#1E1F21" font-size="13">Local tone</text>
    <rect x="220" y="232" width="280" height="10" rx="5" fill="#858688"/>
    <rect x="220" y="232" width="90" height="10" rx="5" fill="#79A135"/>
    <circle cx="310" cy="237" r="8" fill="#27350E"/>

    <rect x="20" y="270" width="18" height="18" rx="3" fill="#27350E"/>
    <text x="46" y="284" fill="#000000" font-size="14">Show the light meter on screen</text>
    <text x="46" y="300" fill="#2F3133" font-size="11">A lamp in the corner: red for dark, green for full light</text>

    <text x="20" y="342" fill="#000000" font-size="15" font-weight="700" letter-spacing="1">PRE-SR MULTIPASS</text>
    <line x1="20" y1="352" x2="500" y2="352" stroke="#858688" stroke-width="1"/>

    <rect x="20" y="368" width="18" height="18" rx="3" fill="#27350E"/>
    <text x="46" y="382" fill="#000000" font-size="14">Before Super Resolution</text>

    <text x="20" y="416" fill="#000000" font-size="14">Model passes</text>
    <rect x="220" y="404" width="280" height="10" rx="5" fill="#858688"/>
    <rect x="220" y="404" width="140" height="10" rx="5" fill="#79A135"/>
    <circle cx="360" cy="409" r="8" fill="#27350E"/>
    <text x="440" y="416" fill="#1E1F21" font-size="12">2</text>

    <text x="20" y="458" fill="#000000" font-size="15" font-weight="700" letter-spacing="1">APPEARANCE</text>
    <line x1="20" y1="468" x2="500" y2="468" stroke="#858688" stroke-width="1"/>

    <rect x="20" y="484" width="18" height="18" rx="3" fill="#27350E"/>
    <text x="46" y="498" fill="#000000" font-size="14">Light panel</text>

    <text x="20" y="528" fill="#000000" font-size="14">Font size</text>
    <rect x="220" y="516" width="280" height="10" rx="5" fill="#858688"/>
    <rect x="220" y="516" width="200" height="10" rx="5" fill="#79A135"/>
    <circle cx="420" cy="521" r="8" fill="#27350E"/>
    <text x="440" y="528" fill="#1E1F21" font-size="12">1.15x</text>
  </g>

  <!-- ============ DARK PANEL ============ -->
  <g transform="translate(600,40)">
    <rect x="0" y="0" width="520" height="540" rx="10" fill="#1C1C1D"/>
    <rect x="0" y="0" width="520" height="46" rx="10" fill="#161617"/>
    <rect x="0" y="30" width="520" height="16" fill="#161617"/>
    <text x="20" y="30" fill="#E7E7E7" font-size="20" font-weight="600">DLSS 5 DEVELOPER CONTROLS</text>

    <text x="20" y="80" fill="#E7E7E7" font-size="15" font-weight="700" letter-spacing="1">GLOBAL CONTROLS</text>
    <line x1="20" y1="90" x2="500" y2="90" stroke="#282828" stroke-width="1"/>

    <text x="20" y="122" fill="#A2A2A0" font-size="14">Model preset</text>
    <rect x="220" y="106" width="280" height="26" rx="4" fill="#282828"/>
    <rect x="220" y="106" width="180" height="26" rx="4" fill="#8CBA3D"/>
    <text x="230" y="123" fill="#0F170D" font-size="12">Quality</text>

    <text x="20" y="164" fill="#A2A2A0" font-size="14">Intensity</text>
    <rect x="220" y="152" width="280" height="10" rx="5" fill="#282828"/>
    <rect x="220" y="152" width="190" height="10" rx="5" fill="#8CBA3D"/>
    <circle cx="410" cy="157" r="8" fill="#8CBA3D"/>
    <text x="440" y="163" fill="#8A8A8C" font-size="12">0.72x</text>

    <text x="20" y="204" fill="#8A8A8C" font-size="13">Local structure</text>
    <rect x="220" y="192" width="280" height="10" rx="5" fill="#282828"/>
    <rect x="220" y="192" width="120" height="10" rx="5" fill="#8CBA3D"/>
    <circle cx="340" cy="197" r="8" fill="#8CBA3D"/>

    <text x="20" y="244" fill="#8A8A8C" font-size="13">Local tone</text>
    <rect x="220" y="232" width="280" height="10" rx="5" fill="#282828"/>
    <rect x="220" y="232" width="90" height="10" rx="5" fill="#8CBA3D"/>
    <circle cx="310" cy="237" r="8" fill="#8CBA3D"/>

    <rect x="20" y="270" width="18" height="18" rx="3" fill="#8CBA3D"/>
    <text x="46" y="284" fill="#A2A2A0" font-size="14">Show the light meter on screen</text>
    <text x="46" y="300" fill="#605E5F" font-size="11">A lamp in the corner: red for dark, green for full light</text>

    <text x="20" y="342" fill="#E7E7E7" font-size="15" font-weight="700" letter-spacing="1">PRE-SR MULTIPASS</text>
    <line x1="20" y1="352" x2="500" y2="352" stroke="#282828" stroke-width="1"/>

    <rect x="20" y="368" width="18" height="18" rx="3" fill="#8CBA3D"/>
    <text x="46" y="382" fill="#A2A2A0" font-size="14">Before Super Resolution</text>

    <text x="20" y="416" fill="#A2A2A0" font-size="14">Model passes</text>
    <rect x="220" y="404" width="280" height="10" rx="5" fill="#282828"/>
    <rect x="220" y="404" width="140" height="10" rx="5" fill="#8CBA3D"/>
    <circle cx="360" cy="409" r="8" fill="#8CBA3D"/>
    <text x="440" y="416" fill="#8A8A8C" font-size="12">2</text>

    <text x="20" y="458" fill="#E7E7E7" font-size="15" font-weight="700" letter-spacing="1">APPEARANCE</text>
    <line x1="20" y1="468" x2="500" y2="468" stroke="#282828" stroke-width="1"/>

    <rect x="20" y="484" width="18" height="18" rx="3" fill="#282828"/>
    <text x="46" y="498" fill="#A2A2A0" font-size="14">Light panel</text>

    <text x="20" y="528" fill="#A2A2A0" font-size="14">Font size</text>
    <rect x="220" y="516" width="280" height="10" rx="5" fill="#282828"/>
    <rect x="220" y="516" width="200" height="10" rx="5" fill="#8CBA3D"/>
    <circle cx="420" cy="521" r="8" fill="#8CBA3D"/>
    <text x="440" y="528" fill="#8A8A8C" font-size="12">1.15x</text>
  </g>

  <text x="300" y="600" fill="#888888" font-size="13" text-anchor="middle">Light</text>
  <text x="860" y="600" fill="#888888" font-size="13" text-anchor="middle">Dark</text>
</svg>
