name: Publish a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update (e.g. v1.1.0). Must match the version in package.json."
        required: true
        default: "v1.1.0"
      title:
        description: "Release title. Leave empty to name it after the tag."
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      engine_tag:
        description: "Override the engine release to bundle, e.g. v2.0.0. Leave empty to bundle the engineVersion pinned in package.json."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Check the tag matches package.json
      shell: pwsh
      run: |
        $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
        $tag = "${{ inputs.tag }}" -replace '^v', ''

        if ($pkg -ne $tag) {
          Write-Error "package.json is $pkg but the tag is ${{ inputs.tag }}. Bump one to match the other."
          exit 1
        }

        Write-Output "package.json $pkg matches tag ${{ inputs.tag }}."

    # The title used to be a required input whose DEFAULT was the literal string
    # "OptiScaler Manager v1.1.0". Nobody ever passed one, so every release since has been titled
    # v1.1.0 -- v2.3.23 shipped under it, on the GitHub release page and on the Discord card.
    # A version written by hand in a second place is a version that goes stale, so it is derived
    # from the tag now, and a title that names a DIFFERENT version is refused rather than published.
    - name: Work out the release title
      id: title
      shell: pwsh
      run: |
        $tag = "${{ inputs.tag }}".Trim()
        $given = "${{ inputs.title }}".Trim()
        if (-not $given) {
          $title = "OptiDLSS5-UI $tag"
        } else {
          $m = [regex]::Match($given, 'v?\d+\.\d+\.\d+')
          if ($m.Success -and ("v" + $m.Value.TrimStart('v')) -ne $tag) {
            Write-Error "The title '$given' names $($m.Value) but the tag is $tag. Leave the title empty to name it after the tag."
            exit 1
          }
          $title = $given
        }
        Write-Output "Release title: $title"
        "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Install
      run: npm ci

    # The suite drives main.js's own handlers (install/remove round trips, detection, routes,
    # last-run verdicts). A release never ships with a red suite.
    - name: Test
      run: npm test

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build DLSS5Injector.exe
      shell: cmd
      run: |
        cd tools\DLSS5Injector
        cl /std:c++17 /EHsc /O2 /Fe:DLSS5Injector.exe DLSS5Injector.cpp
        if not exist DLSS5Injector.exe exit /b 1

    # Bundled into the installer (package.json extraResources: engine/ -> resources/engine/), so a
    # fresh install has the engine on disk before it ever touches the network. The app extracts
    # it on first launch and still checks GitHub for anything newer.
    - name: Fetch the OptiScaler_DLSSNR engine build to bundle
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Authenticated with the job token: an anonymous call from a shared runner IP is rate
        # limited, and the limited answer is a JSON error with no assets in it -- which read as
        # "no zip on the release" and failed two releases in a row (2026-09-12). Retried with a
        # pause for the ordinary hiccups on top of that.
        $headers = @{ 'User-Agent' = 'OptiDLSS5-UI-release'; Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GITHUB_TOKEN" }

        # The engine is PINNED: package.json's "engineVersion" names the exact engine release this
        # manager version was tested with, and the same commit always builds the same pair. It used
        # to take /releases/latest, which meant the engine had to be released BEFORE the manager and
        # a rebuild of an old tag picked up whatever engine happened to be newest that day (and
        # /latest skips pre-releases, so a v2 manager could silently carry a v1 engine). The
        # engine_tag input still overrides it for a one-off build; nothing falls back to "latest".
        $engineTag = "${{ inputs.engine_tag }}".Trim()
        if (-not $engineTag) {
          $engineTag = ((Get-Content package.json -Raw | ConvertFrom-Json).engineVersion + '').Trim()
          Write-Output "Engine pinned in package.json: $engineTag"
        } else {
          Write-Output "Engine overridden by the engine_tag input: $engineTag"
        }
        if ($engineTag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
          Write-Error "package.json engineVersion (or the engine_tag input) must be an exact engine tag like v1.0.41, got '$engineTag'."
          exit 1
        }
        $uri = "https://api.github.com/repos/mrcgibb9876-hash/OptiScaler_DLSSNR/releases/tags/$engineTag"
        Write-Output "Engine release: $uri"

        $asset = $null
        $release = $null
        for ($attempt = 1; $attempt -le 5; $attempt++) {
          try {
            $release = Invoke-RestMethod -Headers $headers -Uri $uri
            $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1
          } catch {
            Write-Output "attempt $attempt failed: $($_.Exception.Message)"
          }
          if ($asset) { break }
          Write-Output "attempt $($attempt): no .zip asset on engine $engineTag yet ($($release.tag_name)); waiting"
          Start-Sleep -Seconds (10 * $attempt)
        }

        if (-not $asset) {
          Write-Error "No .zip asset found on OptiScaler_DLSSNR release $engineTag ($($release.tag_name)) after 5 attempts."
          exit 1
        }

        # Said out loud so a mismatched pair is visible in the log rather than only in the artefact.
        if ($release.tag_name -ne $engineTag) {
          Write-Error "Asked for engine $engineTag but got $($release.tag_name)."
          exit 1
        }

        New-Item -ItemType Directory -Force engine | Out-Null
        Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile engine\OptiScaler_DLSSNR.zip
        Set-Content -Path engine\VERSION -Value $release.tag_name -NoNewline -Encoding ascii
        $mb = [math]::Round((Get-Item engine\OptiScaler_DLSSNR.zip).Length / 1MB, 1)
        Write-Output "engine\OptiScaler_DLSSNR.zip  ($mb MB, $($release.tag_name), from $($asset.name))"

    - name: Build
      run: npm run dist

    - name: Check the installers are there
      shell: pwsh
      run: |
        $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

        $expected = @(
          "dist\OptiDLSS5-UI-Setup-$version.exe",
          "dist\OptiDLSS5-UI-Portable-$version.exe",
          "dist\latest.yml",
          "dist\OptiDLSS5-UI-Setup-$version.exe.blockmap"
        )

        foreach ($file in $expected) {
          if (-Not (Test-Path $file)) {
            Write-Output "dist contains:"
            Get-ChildItem dist | Select-Object -ExpandProperty Name
            Write-Error "Missing: $file"
            exit 1
          }

          $mb = [math]::Round((Get-Item $file).Length / 1MB, 1)
          Write-Output "$file  ($mb MB)"
        }

        # DLSS5Injector.exe is gitignored (built above, not committed) and only reaches the
        # installer via extraResources -- confirmed live that a missing source file there fails
        # silently rather than failing the build, so v1.7.0 shipped without it. Check the actual
        # packaged output, not just that the build step didn't error.
        if (-Not (Test-Path "dist\win-unpacked\resources\DLSS5Injector.exe")) {
          Write-Error "DLSS5Injector.exe did not make it into the packaged app -- the injector feature would ship broken."
          exit 1
        }

    - name: Check the engine made it into the package, and attach it as its own asset too
      shell: pwsh
      run: |
        if (-Not (Test-Path "dist\win-unpacked\resources\engine\OptiScaler_DLSSNR.zip")) {
          Write-Error "engine\OptiScaler_DLSSNR.zip did not make it into the packaged app -- first launch would have nothing to set up."
          exit 1
        }

        # Same zip, also downloadable on its own for anyone setting the release folder by hand.
        $tag = (Get-Content engine\VERSION -Raw).Trim()
        Copy-Item engine\OptiScaler_DLSSNR.zip "dist\OptiScaler_DLSSNR-$tag.zip"
        Write-Output "dist\OptiScaler_DLSSNR-$tag.zip"

    # Published to the PUBLIC releases repo, not this one. This repo is private, and a private repo's
    # releases are private too: the app's updater (package.json publish) and Check for Updates
    # (main.js MANAGER_REPO) read that repo. The job's own GITHUB_TOKEN cannot write to another repo,
    # so RELEASES_REPO_TOKEN is a fine-grained token with Contents: read and write on
    # mrcgibb9876-hash/OptiDLSS5-UI-releases only. Without it this fails, loudly, rather than publish
    # somewhere nobody's app looks.
    - name: Check the releases repo token is set
      shell: pwsh
      env:
        RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      run: |
        if (-not $env:RELEASES_REPO_TOKEN) {
          Write-Error "RELEASES_REPO_TOKEN is not set. Create a fine-grained token with Contents: read and write on mrcgibb9876-hash/OptiDLSS5-UI-releases, then: gh secret set RELEASES_REPO_TOKEN"
          exit 1
        }

    - name: Publish
      uses: softprops/action-gh-release@v2
      with:
        repository: mrcgibb9876-hash/OptiDLSS5-UI-releases
        token: ${{ secrets.RELEASES_REPO_TOKEN }}
        tag_name: ${{ inputs.tag }}
        name: ${{ steps.title.outputs.title }}
        prerelease: ${{ inputs.prerelease }}
        body: |
          [![Join the Discord](https://img.shields.io/badge/Join%20the%20Discord-Help%20·%20Results%20·%20Releases-5865F2?style=for-the-badge&logo=discord&logoColor=white)](https://discord.gg/HFZTDdSNmJ)

          ### What to download

          **`OptiDLSS5-UI-Setup-*.exe`** — the installer. Most people want this one. The app updates itself after that.

          **`OptiDLSS5-UI-Portable-*.exe`** — the same app with nothing to install.

          <details>
          <summary>The other files are not downloads</summary>

          `latest.yml` and `*.exe.blockmap` are for the app, not for you. The updater reads `latest.yml` to
          find the next version, and the blockmap lets it fetch only the parts of the installer that changed
          instead of the whole thing. Downloading either by hand does nothing.

          `OptiScaler_DLSSNR-*.zip` is the engine. It is already inside the installer and is set up for you on
          first launch — it is here on its own only for anyone putting a game folder together by hand.

          </details>
        # latest.yml + the blockmap are what the Manager's own updater (electron-updater, GitHub
        # provider) reads to find and delta-download the next build -- see src/manager-update.js.
        files: |
          dist/*.exe
          dist/*.blockmap
          dist/latest.yml
          dist/OptiScaler_DLSSNR-*.zip

    # TRANSITION ONLY. Copies installed before the move still read THIS repo's latest.yml, so they
    # would never hear of a release that exists only in the releases repo. The same build goes here
    # too; installing it moves them over, because it reads the releases repo from then on. Once this
    # repo is private these copies are invisible and harmless, and this step can be deleted when
    # nobody is left on a version from before the move.
    - name: Publish here too (hand-over for older installs)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ steps.title.outputs.title }}
        prerelease: ${{ inputs.prerelease }}
        body: |
          This build moves the app's downloads to [OptiDLSS5-UI-releases](https://github.com/mrcgibb9876-hash/OptiDLSS5-UI-releases/releases/latest). Updates keep arriving on their own; for a fresh download, go there.
        files: |
          dist/*.exe
          dist/*.blockmap
          dist/latest.yml
          dist/OptiScaler_DLSSNR-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # A card in the Discord server's #announcements once the release is live. The webhook URL lives
    # in the DISCORD_RELEASE_WEBHOOK secret; without it (a fork) this step does nothing.
    #
    # A pre-release announces itself too, as a DIFFERENT card: amber rather than green, the warning
    # first, and the fact that nobody will be given it automatically said out loud. This used to be
    # `if: !inputs.prerelease` -- pre-releases stayed silent, which meant the builds that most need
    # testers were the ones nobody was told about, and the post then had to be written and pasted by
    # hand every time. Silence is the wrong default; an unmistakably-marked card is the right one.
    #
    # A failed post never fails the release -- shipping the build matters more than announcing it --
    # but it does raise a warning that lands on the run's summary page, because the alternative is
    # what happened with v1.73.0: the webhook had been deleted, Discord answered "Unknown Webhook"
    # (code 10015), the step went red inside a green job, and the release went out with nobody told.
    # A post that silently does not happen is worse than one that fails loudly.
    #
    # Where the webhook is, for when it next needs replacing: guild "OptiDLSS5-UI"
    # (1549486108859957308), channel #announcements (1549487286364934174), webhook named
    # "OptiDLSS5-UI Releases". It has died twice now -- once before v1.73.0, and again when the
    # setup bot was removed from the server, which cost the v1.74.1 and v1.74.2 announcements.
    # Remaking it needs Manage Webhooks in that server and `gh secret set DISCORD_RELEASE_WEBHOOK`.
    # Stable releases only. A pre-release is a build handed to a handful of testers on purpose; a
    # card in #announcements is the opposite of that -- it tells everyone, and the card's own text
    # then has to spend two paragraphs talking them out of installing it. Asked for 2026-09-25, after
    # the v2.14.0-beta cards went out. The step is skipped rather than made to post something quieter,
    # because "announce this to the server" and "do not announce this" are not the same card.
    #
    # Both forms of true are tested on purpose. The input is declared `type: boolean`, but a run
    # dispatched through the API can deliver the STRING "true" -- and GitHub compares a string to a
    # boolean by casting both to numbers, so "true" becomes NaN, `!= true` is satisfied, and the card
    # posts for exactly the build that must not announce. The PowerShell below already guards against
    # the same thing with `-eq 'true'`.
    - name: Announce on Discord
      if: ${{ inputs.prerelease != true && inputs.prerelease != 'true' }}
      shell: pwsh
      continue-on-error: true
      env:
        DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ steps.title.outputs.title }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        if (-not $env:DISCORD_RELEASE_WEBHOOK) {
          Write-Output "::warning title=Discord announcement skipped::No DISCORD_RELEASE_WEBHOOK secret is set, so this release was not announced."
          exit 0
        }
        # The public releases repo: this one is private, so its pages and raw files are not reachable.
        $repo = "mrcgibb9876-hash/OptiDLSS5-UI-releases"
        $page = "https://github.com/$repo/releases/tag/$env:TAG"
        $engine = if (Test-Path engine\VERSION) { (Get-Content engine\VERSION -Raw).Trim() } else { $null }
        # PowerShell gets "true"/"false" as a string here, not a boolean.
        $pre = $env:PRERELEASE -eq 'true'

        if ($pre) {
          # The warning goes first, before anything that might tempt someone to install it, and the
          # second line is the one people most need: nothing will hand them this build, so if they
          # are reading it out of curiosity rather than to test, they can stop here.
          $lines = @(
            "**This is a pre-release.** It is here to be tested, not to be relied on -- expect it to misbehave, and say so when it does.",
            "",
            "**You will not get this automatically.** The app only updates itself to stable releases, so this is a deliberate download.",
            "",
            "**Download:** [GitHub release $env:TAG]($page)"
          )
        } else {
          $lines = @(
            "A new version is out. The app updates itself: if it hasn't yet, press **Check for Updates** at the top.",
            "",
            "**Download:** [GitHub release $env:TAG]($page)"
          )
        }
        if ($engine) { $lines += "**Engine:** OptiScaler_DLSSNR $engine" }
        $payload = @{
          username = "OptiDLSS5-UI Releases"
          embeds = @(@{
            title = $(if ($pre) { "⚠️ PRE-RELEASE -- $env:TITLE" } else { "🚀 $env:TITLE" })
            url = $page
            description = ($lines -join "`n")
            # Amber, the same warning colour the app's own UI uses, so the card reads as a warning
            # at a glance in a channel of green ones.
            color = $(if ($pre) { 0xD9A441 } else { 0x76B900 })
            thumbnail = @{ url = "https://raw.githubusercontent.com/$repo/main/icon.png" }
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
          })
        } | ConvertTo-Json -Depth 6
        try {
          Invoke-RestMethod -Method Post -Uri $env:DISCORD_RELEASE_WEBHOOK -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
          Write-Output "Posted to Discord."
          "✅ Announced on Discord." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        }
        catch {
          # Discord's own reason, not just a status code: 10015 "Unknown Webhook" means the webhook
          # has been deleted and the secret needs replacing, which reads nothing like a network blip.
          $reason = $_.ErrorDetails.Message
          if (-not $reason) { $reason = $_.Exception.Message }
          $reason = ($reason -replace '\s+', ' ').Trim()
          Write-Output "::warning title=Discord announcement failed::$env:TAG went out but was not announced. Discord said: $reason  -- if this is code 10015 (Unknown Webhook), the DISCORD_RELEASE_WEBHOOK secret points at a webhook that no longer exists; make a new one in Server Settings > Integrations > Webhooks and update the secret."
          # The run summary, not just an annotation: this is the line a human actually sees on the
          # run page without opening the log.
          "❌ **$env:TAG was NOT announced on Discord.** Discord said: ``$reason``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Code 10015 (Unknown Webhook) means ``DISCORD_RELEASE_WEBHOOK`` points at a webhook that no longer exists. Make a new one in Server Settings > Integrations > Webhooks and run ``gh secret set DISCORD_RELEASE_WEBHOOK``." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # exit 1, not 0. continue-on-error above already keeps the release green, so failing here
          # costs nothing and is the only thing that makes the step read as failed rather than
          # passed. It had `exit 0`, which is why v1.73.0, v1.74.1 and v1.74.2 all reported
          # "Announce on Discord: success" while announcing nothing -- three releases in a row,
          # twice believed by someone checking the step's conclusion through the API.
          exit 1
        }
