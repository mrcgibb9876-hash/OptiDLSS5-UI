name: Publish a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update (e.g. v1.1.0). Must match the version in package.json."
        required: true
        default: "v1.1.0"
      title:
        description: "Release title"
        required: true
        default: "OptiScaler Manager v1.1.0"
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Check the tag matches package.json
      shell: pwsh
      run: |
        $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
        $tag = "${{ inputs.tag }}" -replace '^v', ''

        if ($pkg -ne $tag) {
          Write-Error "package.json is $pkg but the tag is ${{ inputs.tag }}. Bump one to match the other."
          exit 1
        }

        Write-Output "package.json $pkg matches tag ${{ inputs.tag }}."

    - name: Install
      run: npm ci

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build DLSS5Injector.exe
      shell: cmd
      run: |
        cd tools\DLSS5Injector
        cl /std:c++17 /EHsc /O2 /Fe:DLSS5Injector.exe DLSS5Injector.cpp
        if not exist DLSS5Injector.exe exit /b 1

    # Bundled into the installer (package.json extraResources: engine/ -> resources/engine/), so a
    # fresh install has the engine on disk before it ever touches the network. The app extracts
    # it on first launch and still checks GitHub for anything newer.
    - name: Fetch the OptiScaler_DLSSNR engine build to bundle
      shell: pwsh
      run: |
        $headers = @{ 'User-Agent' = 'OptiDLSS5-UI-release'; Accept = 'application/vnd.github+json' }
        $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/mrcgibb9876-hash/OptiScaler_DLSSNR/releases/latest'
        $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1

        if (-not $asset) {
          Write-Error "No .zip asset found on OptiScaler_DLSSNR's latest release ($($release.tag_name))."
          exit 1
        }

        New-Item -ItemType Directory -Force engine | Out-Null
        Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile engine\OptiScaler_DLSSNR.zip
        Set-Content -Path engine\VERSION -Value $release.tag_name -NoNewline -Encoding ascii
        $mb = [math]::Round((Get-Item engine\OptiScaler_DLSSNR.zip).Length / 1MB, 1)
        Write-Output "engine\OptiScaler_DLSSNR.zip  ($mb MB, $($release.tag_name), from $($asset.name))"

    - name: Build
      run: npm run dist

    - name: Check the installers are there
      shell: pwsh
      run: |
        $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

        $expected = @(
          "dist\OptiDLSS5-UI-Setup-$version.exe",
          "dist\OptiDLSS5-UI-Portable-$version.exe",
          "dist\latest.yml",
          "dist\OptiDLSS5-UI-Setup-$version.exe.blockmap"
        )

        foreach ($file in $expected) {
          if (-Not (Test-Path $file)) {
            Write-Output "dist contains:"
            Get-ChildItem dist | Select-Object -ExpandProperty Name
            Write-Error "Missing: $file"
            exit 1
          }

          $mb = [math]::Round((Get-Item $file).Length / 1MB, 1)
          Write-Output "$file  ($mb MB)"
        }

        # DLSS5Injector.exe is gitignored (built above, not committed) and only reaches the
        # installer via extraResources -- confirmed live that a missing source file there fails
        # silently rather than failing the build, so v1.7.0 shipped without it. Check the actual
        # packaged output, not just that the build step didn't error.
        if (-Not (Test-Path "dist\win-unpacked\resources\DLSS5Injector.exe")) {
          Write-Error "DLSS5Injector.exe did not make it into the packaged app -- the injector feature would ship broken."
          exit 1
        }

    - name: Check the engine made it into the package, and attach it as its own asset too
      shell: pwsh
      run: |
        if (-Not (Test-Path "dist\win-unpacked\resources\engine\OptiScaler_DLSSNR.zip")) {
          Write-Error "engine\OptiScaler_DLSSNR.zip did not make it into the packaged app -- first launch would have nothing to set up."
          exit 1
        }

        # Same zip, also downloadable on its own for anyone setting the release folder by hand.
        $tag = (Get-Content engine\VERSION -Raw).Trim()
        Copy-Item engine\OptiScaler_DLSSNR.zip "dist\OptiScaler_DLSSNR-$tag.zip"
        Write-Output "dist\OptiScaler_DLSSNR-$tag.zip"

    - name: Publish
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.title }}
        prerelease: ${{ inputs.prerelease }}
        # latest.yml + the blockmap are what the Manager's own updater (electron-updater, GitHub
        # provider) reads to find and delta-download the next build -- see src/manager-update.js.
        files: |
          dist/*.exe
          dist/*.blockmap
          dist/latest.yml
          dist/OptiScaler_DLSSNR-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
