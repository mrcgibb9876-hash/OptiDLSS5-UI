name: Publish a release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update (e.g. v2.1.0). Must match the version in package.json."
        required: false
      title:
        description: "Release title"
        required: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Check the tag matches package.json
      shell: pwsh
      run: |
        $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
        $rawTag = "${{ inputs.tag }}"
        if (-not $rawTag) { $rawTag = "${{ github.ref_name }}" }
        $tag = $rawTag -replace '^v', ''

        if ($pkg -ne $tag) {
          Write-Error "package.json is $pkg but the tag is $rawTag. Bump one to match the other."
          exit 1
        }

        Write-Output "package.json $pkg matches tag $rawTag."

    - name: Install
      run: npm ci

    - name: Build
      run: npm run dist

    - name: Check the installers are there
      shell: pwsh
      run: |
        $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

        $expected = @(
          "dist\OptiDLSS5-UI Setup $version.exe",
          "dist\OptiDLSS5-UI $version.exe"
        )

        foreach ($file in $expected) {
          if (-Not (Test-Path $file)) {
            Write-Output "dist contains:"
            Get-ChildItem dist | Select-Object -ExpandProperty Name
            Write-Error "Missing: $file"
            exit 1
          }

          $mb = [math]::Round((Get-Item $file).Length / 1MB, 1)
          Write-Output "$file  ($mb MB)"
        }

    - name: Fetch the OptiScaler_DLSSNR engine build
      shell: pwsh
      run: |
        $headers = @{
          'User-Agent' = 'OptiDLSS5-UI-release'
          'Accept' = 'application/vnd.github+json'
          'Authorization' = 'Bearer ${{ secrets.GITHUB_TOKEN }}'
        }
        $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/mrcgibb9876-hash/OptiScaler_DLSSNR/releases/latest'
        $asset = $release.assets | Where-Object { $_.name -like '*.zip' } | Select-Object -First 1

        if (-not $asset) {
          Write-Error "No .zip asset found on OptiScaler_DLSSNR's latest release ($($release.tag_name))."
          exit 1
        }

        $dest = "dist\OptiScaler_DLSSNR-$($release.tag_name).zip"
        $downloadHeaders = @{ 'User-Agent' = 'OptiDLSS5-UI-release' }
        Invoke-WebRequest -Headers $downloadHeaders -Uri $asset.browser_download_url -OutFile $dest
        $mb = [math]::Round((Get-Item $dest).Length / 1MB, 1)
        Write-Output "$dest  ($mb MB, from $($asset.name))"

    - name: Get tag and title
      id: meta
      shell: pwsh
      run: |
        $tag = "${{ inputs.tag }}"
        if (-not $tag) { $tag = "${{ github.ref_name }}" }
        $title = "${{ inputs.title }}"
        if (-not $title) { $title = "OptiDLSS5-UI $tag" }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "title=$title"

    - name: Publish
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        name: ${{ steps.meta.outputs.title }}
        prerelease: ${{ inputs.prerelease || false }}
        files: |
          dist/*.exe
          dist/OptiScaler_DLSSNR-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
